<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bác sĩ Khánh Minh · Phòng khám 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#6fa8e6 0%,#bcd8f2 55%,#e9e3d6 100%);
    font:15px/1.45 "Trebuchet MS","Segoe UI",Roboto,sans-serif;color:#1d2a33;user-select:none;-webkit-user-select:none}
  canvas{display:block;touch-action:none}
  .hud{position:fixed;pointer-events:none;inset:0}
  .hud > *{pointer-events:auto}
  #tasks{position:absolute;left:14px;top:14px;background:#fffdf6ee;border:3px solid #1d2a33;border-radius:12px;
    padding:10px 14px;min-width:200px;box-shadow:0 4px 0 #1d2a33}
  #tasks h1{font-size:16px;margin:0 0 6px;letter-spacing:.02em}
  #tasks ul{list-style:none;margin:0;padding:0}
  #tasks li{padding:2px 0;color:#5b6770}
  #tasks li.ok{color:#2f7d3b;font-weight:700}
  #tasks li.ok::before{content:"✓ "}
  #tasks li:not(.ok)::before{content:"○ "}
  #topright{position:absolute;right:14px;top:14px;display:flex;gap:8px}
  .pill{background:#fffdf6;border:3px solid #1d2a33;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;
    cursor:pointer;box-shadow:0 3px 0 #1d2a33;color:#1d2a33}
  .pill:active{transform:translateY(2px);box-shadow:0 1px 0 #1d2a33}
  #prompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:#1d2a33;color:#fff;
    padding:8px 16px;border-radius:999px;font-weight:700;display:none;white-space:nowrap}
  #prompt kbd{background:#ffd23a;color:#1d2a33;border-radius:5px;padding:0 7px;margin-right:6px}
  #dlg{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(620px,calc(100% - 28px));
    background:#fffdf6;border:3px solid #1d2a33;border-radius:14px;padding:14px 18px 12px;box-shadow:0 5px 0 #1d2a33;display:none}
  #dlg .nm{position:absolute;top:-16px;left:14px;background:#ffd23a;border:3px solid #1d2a33;border-radius:8px;
    padding:1px 10px;font-weight:800;font-size:14px}
  #dlg .tx{font-size:18px;margin:6px 0 4px;min-height:26px}
  #dlg .tr{font-size:14px;color:#5b6770;font-style:italic}
  #dlg .ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  #dlg .ch button{font:inherit;font-weight:700;border:2px solid #1d2a33;border-radius:9px;background:#fff;padding:8px 12px;
    cursor:pointer;min-height:40px;color:#1d2a33}
  #dlg .ch button:hover{background:#ffd23a}
  #dlg .hint{font-size:12px;color:#8a949a;text-align:right;margin-top:6px}
  #lift{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:none;font-size:18px;
    background:#e5484d;color:#fff;border-color:#1d2a33;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
  #help{position:absolute;right:14px;bottom:14px;background:#fffdf6dd;border:2px solid #1d2a33;border-radius:10px;
    padding:8px 12px;font-size:13px;max-width:230px}
  #toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:#1d2a33;color:#fff;border-radius:10px;
    padding:8px 16px;font-weight:700;opacity:0;transition:opacity .3s}
  .paw{position:fixed;font-size:90px;pointer-events:none;animation:paw 1.6s ease-out forwards}
  @keyframes paw{0%{transform:scale(2.2) rotate(-20deg);opacity:0}15%{transform:scale(1) rotate(-12deg);opacity:1}
    80%{opacity:1}100%{opacity:0}}
  #joy{position:absolute;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#1d2a3326;
    border:3px solid #1d2a3388;display:none;touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffd23a;border:3px solid #1d2a33}
  #act{position:absolute;right:24px;bottom:40px;width:78px;height:78px;border-radius:50%;font-size:16px;display:none}
  body.touch #joy,body.touch #act{display:block}
  body.touch #help{display:none}
  body.touch #dlg{bottom:160px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px}
  #tasks li{padding:4px 0;color:#1d2a33;border-bottom:1px dashed #d8d0bf}
  #tasks li small{color:#5b6770}
  #tasks li.bad{color:#b5462f}
  #tasks li.dog{border:0;color:#5b6770;font-size:13px}
  #tasks li::before{content:none!important}
  .bar{display:inline-block;width:70px;height:8px;border:2px solid #1d2a33;border-radius:5px;vertical-align:middle;overflow:hidden;background:#fff}
  .bar i{display:block;height:100%}
  #mg{position:fixed;inset:0;background:#1d2a3366;display:none;place-items:center;z-index:5}
  #mg .card{background:#fffdf6;border:3px solid #1d2a33;border-radius:16px;box-shadow:0 6px 0 #1d2a33;padding:20px 24px;
    width:min(560px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;text-align:center}
  #mg h2{margin:0 0 6px;font-size:22px}
  #mg .sub{color:#5b6770;margin:0 0 12px}
  #mg .dogh{font-size:13px;background:#7ee0a0;border:2px solid #1d2a33;border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
  #mg .big{font-size:26px;font-weight:800;margin:8px 0}
  #mg canvas{display:block;margin:0 auto}
  #mg .meter{position:relative;height:16px;border:3px solid #1d2a33;border-radius:9px;background:#fff;overflow:hidden;margin:8px 0 14px}
  #mg .meter i{display:block;height:100%;background:#2fae5a;width:0}
  #mg .meter .mark{position:absolute;top:0;bottom:0;width:3px;background:#e5484d}
  #mg .hold{font:inherit;font-weight:800;font-size:18px;border:3px solid #1d2a33;border-radius:12px;background:#ffd23a;padding:12px 22px;
    cursor:pointer;box-shadow:0 4px 0 #1d2a33;touch-action:none;color:#1d2a33}
  #mg .hold.on{background:#5ab8f0;transform:translateY(3px);box-shadow:0 1px 0 #1d2a33}
  #mg .say{font-size:20px;font-style:italic;margin:6px 0 14px}
  #mg .opts{display:grid;gap:8px}
  #mg .opts button{font:inherit;text-align:left;border:2px solid #1d2a33;border-radius:10px;background:#fff;padding:10px 14px;cursor:pointer;min-height:44px;color:#1d2a33}
  #mg .opts button:hover:not(:disabled){background:#fff3c4}
  #mg .opts button.good{background:#c9f2d4}
  #mg .opts button.bad{background:#f8d0c8}
  #mg .fb{min-height:24px;margin-top:10px;font-weight:700}
  #mg .timer{font-weight:800;font-size:18px;margin-bottom:10px}
  #mg .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px;margin:0 auto}
  #mg .cardb{aspect-ratio:1;border:3px solid #1d2a33;border-radius:12px;background:#d05098;cursor:pointer;font-size:36px;padding:0}
  #mg .cardb span{visibility:hidden}
  #mg .cardb.up{background:#fff}
  #mg .cardb.up span{visibility:visible}
  #mg .cardb.ok{background:#c9f2d4}
  #mg .how{text-align:left;margin:0 0 12px;padding-left:22px}
  #mg .how li{margin:6px 0}
  #mg .sum{text-align:left;list-style:none;padding:0;margin:0 0 6px}
  #mg .sum li{padding:6px 0;border-bottom:1px dashed #d8d0bf}
  #mg .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .btnp{font:inherit;font-weight:800;border:3px solid #1d2a33;border-radius:12px;background:#ffd23a;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #1d2a33;color:#1d2a33}
  .btnp.alt{background:#fff}
</style>
</head>
<body>
<div id="mg"></div>
<div id="loading">Đang xếp gạch…</div>
<div class="hud">
  <div id="tasks">
    <h1>Bệnh nhân hôm nay</h1>
    <ul id="tasklist"></ul>
  </div>
  <div id="topright">
    <button class="pill" id="snd">🔊</button>
  </div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="dlg"><span class="nm" id="dnm"></span><div class="tx" id="dtx"></div><div class="tr" id="dtr"></div>
    <div class="ch" id="dch"></div><div class="hint" id="dhint"></div></div>
  <div id="help"><b>BS. Khánh Minh</b><br>WASD: đi · Shift: chạy · E: tương tác<br>Kéo chuột: xoay · Lăn: zoom<br><a href="khach.html">Chơi vai khách</a></div>
  <div id="joy"><div id="knob"></div></div>
  <button class="pill" id="act">E</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
"use strict";
const T = THREE;

/* ================= renderer / scene ================= */
const renderer = new T.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.Fog(0xcfe0ef, 70, 170);
const camera = new T.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);

scene.add(new T.HemisphereLight(0xe8f3ff, 0x6f8f4c, 1.25));
const sun = new T.DirectionalLight(0xfff3df, 2.4);
sun.position.set(28, 48, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-42, right:42, top:42, bottom:-42, near:1, far:140});
sun.shadow.bias = -0.0006;
scene.add(sun);

/* ================= LEGO helpers ================= */
const MATS = {};
function mat(color, key){
  const k = color + (key||"");
  if(!MATS[k]){
    MATS[k] = new T.MeshStandardMaterial({color, roughness:0.38, metalness:0.0});
    if(key === "front"){ MATS[k].transparent = true; }
  }
  return MATS[k];
}
const STUD = new T.CylinderGeometry(0.3, 0.3, 0.2, 14);
function brick(w, h, d, color, o){
  o = o || {};
  const g = new T.Group();
  const m = o.mat || mat(color);
  const box = new T.Mesh(new T.BoxGeometry(w, h, d), m);
  box.position.y = h/2; box.castShadow = o.shadow !== false; box.receiveShadow = true;
  g.add(box);
  if(o.studs !== false){
    const nx = Math.max(1, Math.round(w)), nz = Math.max(1, Math.round(d));
    const inst = new T.InstancedMesh(STUD, m, nx*nz);
    const M = new T.Matrix4(); let i = 0;
    for(let a=0;a<nx;a++) for(let b=0;b<nz;b++){
      M.makeTranslation(-w/2 + (a+0.5)*w/nx, h+0.1, -d/2 + (b+0.5)*d/nz);
      inst.setMatrixAt(i++, M);
    }
    inst.castShadow = true; inst.receiveShadow = true;
    g.add(inst);
  }
  return g;
}
function put(o, x, y, z, parent){ o.position.set(x, y, z); (parent||scene).add(o); return o; }
function mesh(geo, color, parent, x, y, z, m){
  const me = new T.Mesh(geo, m || mat(color));
  me.castShadow = true; me.receiveShadow = true;
  me.position.set(x||0, y||0, z||0); (parent||scene).add(me); return me;
}
const BOX = (w,h,d) => new T.BoxGeometry(w,h,d);

function canvasTex(w, h, draw){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function sign(text, w, h, bg, fg, parent, x, y, z, ry){
  const tex = canvasTex(512, Math.round(512*h/w), (c, W, H) => {
    c.fillStyle = bg; c.fillRect(0,0,W,H);
    c.strokeStyle = fg; c.lineWidth = 10; c.strokeRect(8,8,W-16,H-16);
    c.fillStyle = fg; c.textAlign = "center"; c.textBaseline = "middle";
    let fs = H*0.5; c.font = `bold ${fs}px "Trebuchet MS",sans-serif`;
    while(c.measureText(text).width > W*0.86 && fs > 10){ fs -= 2; c.font = `bold ${fs}px "Trebuchet MS",sans-serif`; }
    c.fillText(text, W/2, H/2+2);
  });
  const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshStandardMaterial({map:tex, roughness:.5}));
  m.position.set(x, y, z); m.rotation.y = ry||0; (parent||scene).add(m); return m;
}

/* ================= collisions ================= */
const COLL = [];
function solid(x0, x1, z0, z1){ COLL.push({x0, x1, z0, z1}); }

/* ================= ground ================= */
const COL = {
  grass:0x4f9a3a, plate:0x5aa83f, tan:0xe4cd9e, orange:0xf08a24, green:0xa5ca18, yellow:0xffd23a,
  pink:0xd05098, blue:0x6aa9e0, roof:0x59646d, roofD:0x454e56, brown:0x6b3a1e, red:0xb4232a,
  white:0xf4f4f0, glass:0x9fd3ef, grey:0xa3a9ad, dark:0x2b3036, peach:0xf3b98c
};
const outside = new T.Mesh(new T.PlaneGeometry(400, 400), new T.MeshStandardMaterial({color:0x7fae5a, roughness:1}));
outside.rotation.x = -Math.PI/2; outside.position.y = -0.42; outside.receiveShadow = true; scene.add(outside);
put(brick(48, 0.4, 30, COL.plate), 0, -0.4, 1);                         // baseplate yard x -24..24 z -14..16
put(brick(70, 0.3, 10, COL.grey, {studs:false}), 0, -0.4, 21.2);       // vỉa hè
put(brick(70, 0.31, 8, 0x3c4146, {studs:false}), 0, -0.41, 31);         // đường
for(let x=-32;x<=32;x+=6) put(brick(3, 0.32, 0.4, 0xffffff, {studs:false}), x, -0.41, 31);
// lối đi
for(let z=8; z<16; z+=2) put(brick(3, 0.22, 1.9, (z/2)%2 ? COL.tan : 0xd8bd88), -5, 0, z+1);

/* ================= fence ================= */
(function(){
  const picket = BOX(0.35, 1.6, 0.25);
  const pos = [];
  const seg = (x0,z0,x1,z1) => {
    const L = Math.hypot(x1-x0, z1-z0), n = Math.floor(L/0.8);
    for(let i=0;i<=n;i++) pos.push([x0+(x1-x0)*i/n, z0+(z1-z0)*i/n, Math.atan2(x1-x0, z1-z0)]);
    const rail = put(brick(L, 0.25, 0.2, COL.tan, {studs:false}), (x0+x1)/2, 0.9, (z0+z1)/2);
    rail.rotation.y = Math.atan2(x1-x0, z1-z0) - Math.PI/2;
    rail.children[0].castShadow = false;
  };
  seg(-24,16,-7,16); seg(-3,16,24,16); seg(-24,-14,24,-14); seg(-24,-14,-24,16); seg(24,-14,24,16);
  const inst = new T.InstancedMesh(picket, mat(0xf7efe0), pos.length);
  const M = new T.Matrix4(), Q = new T.Quaternion(), S = new T.Vector3(1,1,1);
  pos.forEach((p,i) => { Q.setFromEuler(new T.Euler(0, p[2], 0)); M.compose(new T.Vector3(p[0], 0.8, p[1]), Q, S); inst.setMatrixAt(i, M); });
  inst.castShadow = true; scene.add(inst);
  solid(-24,-7,15.7,16.3); solid(-3,24,15.7,16.3); solid(-24,24,-14.3,-13.7); solid(-24.3,-23.7,-14,16); solid(23.7,24.3,-14,16);
  // cột cổng
  put(brick(1,2.6,1,COL.white), -7.5, 0, 16); put(brick(1,2.6,1,COL.white), -2.5, 0, 16);
  solid(-8,-7,15.5,16.5); solid(-3,-2,15.5,16.5);
})();

/* ================= trees, bushes, flowers ================= */
function tree(x, z, s){
  s = s||1;
  put(brick(0.9, 2.2*s, 0.9, 0x7a4a24), x, 0, z);
  const g = new T.Group(); put(g, x, 2.0*s, z);
  [[0,0,0,1.6],[0.9,0.6,0.3,1.1],[-0.8,0.5,-0.4,1.2],[0.1,1.4,0.2,1.1],[-0.2,0.4,0.9,1.0]].forEach(p =>
    mesh(new T.SphereGeometry(p[3]*s, 14, 10), 0x3f8a2e, g, p[0]*s, p[1]*s, p[2]*s));
  solid(x-0.6, x+0.6, z-0.6, z+0.6);
}
function bush(x, z){
  const g = new T.Group(); put(g, x, 0, z);
  mesh(new T.SphereGeometry(0.9, 12, 8), 0x5f9e2f, g, 0, 0.6, 0);
  mesh(new T.SphereGeometry(0.7, 12, 8), 0x6aab36, g, 0.7, 0.5, 0.2);
  mesh(new T.SphereGeometry(0.6, 12, 8), 0x58962a, g, -0.6, 0.45, -0.1);
}
tree(-18,-5,1.1); tree(18,5,1); tree(14,-11,0.9); tree(-20,9,0.9); tree(20,-6,0.8);
[[-11,6.5],[11,7.5],[-12,-3],[12,-5],[0.5,8.3],[-21,13],[21,13]].forEach(p => bush(p[0], p[1]));
(function(){
  const cols = [0xe5484d, 0xffd23a, 0xffffff, 0xd05098, 0x6aa9e0];
  const geo = new T.CylinderGeometry(0.22, 0.22, 0.35, 10);
  for(let i=0;i<70;i++){
    const x = (Math.random()*44-22), z = (Math.random()*26-12);
    if(Math.abs(x) < 12 && z > -9 && z < 10) continue;
    if(Math.abs(x+5) < 2.5 && z > 7) continue;
    mesh(geo, cols[i%cols.length], scene, x, 0.15, z);
  }
})();

/* ================= house ================= */
const house = new T.Group(); scene.add(house);
const roofGroup = new T.Group(); house.add(roofGroup);
const frontGroup = new T.Group(); house.add(frontGroup);
const FM = c => mat(c, "front");

put(brick(23, 0.4, 18.5, COL.plate, {studs:false}), 0, -0.4, 1.3, house);          // nền nhà (bay theo)
put(brick(10, 0.21, 13, 0xf2e6c9, {studs:false}), -5, 0, 0, house);                // sàn sảnh
put(brick(9, 0.21, 13, 0xc9a77a, {studs:false}), 5, 0, 0, house);                  // sàn phòng bác sĩ
put(brick(5, 0.18, 1.8, 0xb07a4a, {studs:false}), -5, 0, 7.9, house);              // hiên

const H = 6;
function wallBox(x0, x1, z0, z1, y0, y1, color, parent, m){
  const g = brick(x1-x0, y1-y0, z1-z0, color, {studs:false, mat:m});
  return put(g, (x0+x1)/2, y0, (z0+z1)/2, parent||house);
}
// back, sides
wallBox(-10, 0, -7, -6, 0, H, COL.orange); wallBox(0, 10, -7, -6, 0, 3, COL.green); wallBox(0, 10, -7, -6, 3, H, COL.yellow);
wallBox(-10, -9, -6, 6, 0, H, COL.orange);
wallBox(9, 10, -6, 6, 0, 3, COL.green); wallBox(9, 10, -6, 6, 3, H, COL.yellow);
solid(-10,10,-7,-6); solid(-10,-9,-7,7); solid(9,10,-7,7);
// tan columns lobby corners
[[-10,6],[-10,-7]].forEach(p => wallBox(p[0]-0.2, p[0]+1.2, p[1]-0.2, p[1]+1.2, 0, H, COL.tan));
// front lobby (z 6..7) with door gap x -6.5..-3.5
wallBox(-10, -6.5, 6, 7, 0, H, COL.orange, frontGroup, FM(COL.orange));
wallBox(-3.5, 0, 6, 7, 0, H, COL.orange, frontGroup, FM(COL.orange));
wallBox(-6.5, -3.5, 6, 7, 4, H, COL.orange, frontGroup, FM(COL.orange));
wallBox(-7, -6.5, 6, 7.2, 0, 4.2, COL.tan, frontGroup, FM(COL.tan));
wallBox(-3.5, -3, 6, 7.2, 0, 4.2, COL.tan, frontGroup, FM(COL.tan));
wallBox(-7, -3, 6, 7.2, 4, 4.4, COL.tan, frontGroup, FM(COL.tan));
solid(-10,-6.5,6,7); solid(-3.5,0,6,7);
// front wing (z 6..7)
wallBox(0, 10, 6, 7, 0, 3, COL.green, frontGroup, FM(COL.green));
wallBox(0, 10, 6, 7, 3, H, COL.yellow, frontGroup, FM(COL.yellow));
solid(0,10,6,7);
// bay window
const bay = new T.Group(); put(bay, 5, 0, 7, frontGroup);
put(brick(5, 3.2, 1.4, COL.green, {mat:FM(COL.green), studs:false}), 0, 0.4, 0.7, bay);
put(brick(5.6, 0.4, 1.8, COL.peach, {mat:FM(COL.peach)}), 0, 3.6, 0.8, bay);
put(brick(5.4, 0.4, 1.7, COL.peach, {mat:FM(COL.peach), studs:false}), 0, 0, 0.75, bay);
solid(2.3,7.7,7,8.6);
// wheel (như ảnh)
const wheel = mesh(new T.CylinderGeometry(0.6,0.6,0.35,20), 0x8fa1ad, frontGroup, 1.2, 0.6, 7.25, FM(0x8fa1ad));
wheel.rotation.x = Math.PI/2;
// internal wall x -0.5..0.5 with gap z -1.5..1.5
wallBox(-0.5, 0.5, -6, -1.5, 0, H, 0xf6e9cf, house, FM(0xf6e9cf)); wallBox(-0.5, 0.5, 1.5, 6, 0, H, 0xf6e9cf, house, FM(0xf6e9cf)); wallBox(-0.5, 0.5, -1.5, 1.5, 4.3, H, 0xf6e9cf, house, FM(0xf6e9cf));

// windows

  return g;
}

const clusterBalloons = [];
function addClusterBalloon(color, pos){
  const b = new T.Group();
  const s = mesh(balloonGeo, color, b, 0, 0, 0, new T.MeshStandardMaterial({color, roughness:.22, metalness:.05}));
  s.scale.set(1, 1.15, 1);
  mesh(new T.ConeGeometry(0.16, 0.25, 8), color, b, 0, -0.9, 0).rotation.x = Math.PI;
  b.position.copy(pos); cluster.add(b);
  b.userData.phase = Math.random()*6.28; b.userData.base = pos.clone();
  clusterBalloons.push(b);
  return b;
}

  const arr = [];

    arr.push(anchor.x, anchor.y+1.1, anchor.z, p.x, p.y, p.z);
  });
  stringGeo.setAttribute("position", new T.Float32BufferAttribute(arr, 3));
}

/* ================= faces ================= */
function faceTex(o){
  return canvasTex(256, 128, (c, W, Hh) => {
    c.fillStyle = "#f7cf1f"; c.fillRect(0,0,W,Hh);
    const cx = 128;
    c.fillStyle = "#1b1b1b";
    c.beginPath(); c.arc(cx-17, 52, 6.5, 0, 6.3); c.arc(cx+17, 52, 6.5, 0, 6.3); c.fill();
    c.fillStyle = "#fff"; c.beginPath(); c.arc(cx-15, 50, 2, 0, 6.3); c.arc(cx+19, 50, 2, 0, 6.3); c.fill();
    c.strokeStyle = "#1b1b1b"; c.lineWidth = 3.5; c.lineCap = "round";
    if(o.lashes){ [[-17,1],[17,-1]].forEach(([dx,s]) => { c.beginPath(); c.moveTo(cx+dx-6*s, 46); c.lineTo(cx+dx-11*s, 41); c.stroke(); }); }
    c.beginPath(); c.moveTo(cx-24, o.stern ? 40 : 38); c.lineTo(cx-10, o.stern ? 42 : 36); c.moveTo(cx+10, o.stern ? 42 : 36); c.lineTo(cx+24, o.stern ? 40 : 38); c.stroke();
    if(o.mustache){
      c.fillStyle = "#4a2c16"; c.beginPath(); c.ellipse(cx-9, 73, 12, 5, 0.25, 0, 6.3); c.ellipse(cx+9, 73, 12, 5, -0.25, 0, 6.3); c.fill();
    }
    c.strokeStyle = o.lips ? "#c2185b" : "#1b1b1b"; c.lineWidth = o.lips ? 5 : 4;
    c.beginPath(); c.arc(cx, 70, 15, 0.18*Math.PI, 0.82*Math.PI); c.stroke();
    if(o.blush){ c.fillStyle = "#f2a0a066"; c.beginPath(); c.arc(cx-30, 68, 7, 0, 6.3); c.arc(cx+30, 68, 7, 0, 6.3); c.fill(); }
  });
}

const YEL = 0xf7cf1f;
function makeFig(o){
  const g = new T.Group();

    const piv = new T.Group(); piv.position.set(s*0.26, 1.2, 0); g.add(piv);
    mesh(BOX(0.5, 1.2, 0.62), o.legs, piv, 0, -0.6, 0);
    mesh(BOX(0.5, 0.25, 0.75), o.shoes || o.legs, piv, 0, -1.08, 0.07);
    p[s < 0 ? "legL" : "legR"] = piv;
  });
  mesh(BOX(1.04, 0.28, 0.64), o.legs, g, 0, 1.33, 0);
  const torsoGeo = new T.CylinderGeometry(0.42, 0.56, 1.05, 4, 1); torsoGeo.rotateY(Math.PI/4); torsoGeo.scale(1.35, 1, 0.75);
  mesh(torsoGeo, o.shirt, g, 0, 2.0, 0);
  if(o.coat){
    mesh(BOX(1.12, 0.55, 0.7), o.coat, g, 0, 1.2, 0);
    mesh(BOX(0.18, 0.95, 0.05), 0x2b3036, g, 0, 2.0, 0.42);
    const st = mesh(new T.TorusGeometry(0.32, 0.04, 6, 20, Math.PI), 0x2b3036, g, 0, 2.38, 0.3); st.rotation.set(0, 0, Math.PI);
    mesh(new T.CylinderGeometry(0.08,0.08,0.05,10), 0xb0b6ba, g, 0.15, 1.95, 0.42).rotation.x = Math.PI/2;
  }
  if(o.badge) mesh(BOX(0.22, 0.26, 0.05), 0xffd23a, g, 0.25, 2.15, 0.4);
  if(o.belt) mesh(BOX(1.1, 0.12, 0.66), 0x1b1b1b, g, 0, 1.55, 0);
  [-1, 1].forEach(s => {
    const piv = new T.Group(); piv.position.set(s*0.7, 2.38, 0); g.add(piv);
    const arm = mesh(BOX(0.3, 0.9, 0.36), o.coat || o.shirt, piv, 0, -0.42, 0); arm.rotation.z = s*0.12;
    mesh(new T.CylinderGeometry(0.15, 0.15, 0.25, 12), YEL, piv, s*0.06, -0.95, 0.05);
    p[s < 0 ? "armL" : "armR"] = piv;
  });
  mesh(new T.CylinderGeometry(0.2, 0.2, 0.15, 12), YEL, g, 0, 2.58, 0);
  const head = new T.Group(); head.position.set(0, 2.65, 0); g.add(head);
  const hm = mesh(new T.CylinderGeometry(0.42, 0.42, 0.78, 28), YEL, head, 0, 0.39, 0,
    [new T.MeshStandardMaterial({map:faceTex(o.face||{}), roughness:.4}), mat(YEL), mat(YEL)]);
  hm.rotation.y = Math.PI;
  mesh(new T.CylinderGeometry(0.25, 0.25, 0.18, 14), YEL, head, 0, 0.86, 0);
  if(o.hair === "long"){
    const cap = mesh(new T.SphereGeometry(0.48, 20, 12, 0, Math.PI*2, 0, Math.PI/2), o.hairColor, head, 0, 0.7, 0);
    cap.scale.y = 0.75;
    mesh(BOX(0.92, 1.1, 0.35), o.hairColor, head, 0, 0.25, -0.3);
    mesh(BOX(0.2, 0.75, 0.5), o.hairColor, head, -0.42, 0.4, -0.05);
    mesh(BOX(0.2, 0.75, 0.5), o.hairColor, head, 0.42, 0.4, -0.05);
    mesh(new T.SphereGeometry(0.22, 12, 10), o.hairColor, head, 0, 0.95, -0.35);
  } else if(o.hair === "short"){
    const cap = mesh(new T.SphereGeometry(0.47, 20, 12, 0, Math.PI*2, 0, Math.PI/2), o.hairColor, head, 0, 0.66, 0);
    cap.scale.y = 0.65;
    mesh(BOX(0.9, 0.35, 0.3), o.hairColor, head, 0, 0.6, -0.3);
  }
  if(o.cap){
    mesh(new T.CylinderGeometry(0.47, 0.47, 0.3, 24), o.cap, head, 0, 0.88, 0);
    mesh(new T.CylinderGeometry(0.52, 0.47, 0.12, 24), o.cap, head, 0, 1.05, 0);
    mesh(BOX(0.7, 0.07, 0.35), 0x1b1b1b, head, 0, 0.75, 0.52);
    mesh(BOX(0.18, 0.18, 0.05), 0xffd23a, head, 0, 0.9, 0.48);
  }
  p.head = head; p.group = g;
  g.traverse(m => { if(m.isMesh) m.castShadow = true; });
  return p;
}

function makeDog(o){
  const g = new T.Group(), p = {group:g, legs:[]};
  const c = o.color;
  mesh(BOX(0.85, 0.7, 1.4), c, g, 0, 0.95, 0);
  [[-0.27,0.48],[0.27,0.48],[-0.27,-0.48],[0.27,-0.48]].forEach(q => {
    const piv = new T.Group(); piv.position.set(q[0], 0.7, q[1]); g.add(piv);
    mesh(BOX(0.25, 0.7, 0.25), c, piv, 0, -0.35, 0);
    if(o.poodle) mesh(new T.SphereGeometry(0.2, 10, 8), c, piv, 0, -0.55, 0);
    p.legs.push(piv);
  });
  const head = new T.Group(); head.position.set(0, 1.45, 0.72); g.add(head); p.head = head;
  mesh(BOX(0.75, 0.68, 0.7), c, head, 0, 0.1, 0);
  mesh(BOX(0.42, 0.32, 0.38), o.snout || c, head, 0, -0.04, 0.5);
  mesh(BOX(0.18, 0.14, 0.08), 0x111111, head, 0, 0.08, 0.7);
  [-0.18, 0.18].forEach(x => {
    mesh(BOX(0.1, 0.12, 0.04), 0x111111, head, x, 0.24, 0.36);
    mesh(BOX(0.04, 0.04, 0.02), 0xffffff, head, x+0.02, 0.27, 0.385);
  });
  const tongue = mesh(BOX(0.16, 0.05, 0.2), 0xe86a7c, head, 0, -0.22, 0.6); p.tongue = tongue;
  if(o.poodle){
    mesh(new T.SphereGeometry(0.36, 14, 10), c, head, 0, 0.5, -0.05);
    [-1,1].forEach(s => mesh(new T.SphereGeometry(0.24, 12, 10), c, head, s*0.45, 0.0, -0.05));
    mesh(new T.SphereGeometry(0.5, 14, 10), c, g, 0, 1.1, -0.35);
  } else {
    [-1,1].forEach(s => { const e = mesh(BOX(0.14, 0.5, 0.3), o.ear || c, head, s*0.44, 0.08, -0.05); e.rotation.z = s*0.25; });
  }
  const tail = new T.Group(); tail.position.set(0, 1.2, -0.68); g.add(tail); p.tail = tail;
  const tm = mesh(BOX(0.15, 0.15, 0.65), c, tail, 0, 0, -0.3); tail.rotation.x = -0.8;
  if(o.poodle) mesh(new T.SphereGeometry(0.22, 10, 8), c, tail, 0, 0, -0.65);
  if(o.vest){
    mesh(BOX(0.92, 0.6, 0.7), 0xffffff, g, 0, 0.98, 0.32);
    mesh(BOX(0.06, 0.2, 0.06), 0x2fae5a, g, 0.47, 1.05, 0.42); mesh(BOX(0.06, 0.06, 0.2), 0x2fae5a, g, 0.47, 1.05, 0.42);
    mesh(BOX(0.06, 0.2, 0.06), 0x2fae5a, g, -0.47, 1.05, 0.42); mesh(BOX(0.06, 0.06, 0.2), 0x2fae5a, g, -0.47, 1.05, 0.42);
  }
  if(o.bow){
    const bw = new T.Group(); bw.position.set(0, 1.15, 0.92); g.add(bw);
    [-1,1].forEach(s => { const c2 = mesh(new T.ConeGeometry(0.2, 0.35, 4), 0x8d959b, bw, s*0.18, 0, 0); c2.rotation.z = s*Math.PI/2; });
    mesh(new T.SphereGeometry(0.09, 8, 6), 0x6d757b, bw, 0, 0, 0.02);
  }
  g.traverse(m => { if(m.isMesh) m.castShadow = true; });
  return p;
}

/* ================= sprites ================= */
function tagSprite(text, sub, color){
  const tex = canvasTex(512, 160, (c, W) => {
    c.font = 'bold 54px "Trebuchet MS",sans-serif';
    const w = Math.min(W - 8, Math.max(c.measureText(text).width, 200) + 60);
    const x0 = (W - w)/2;
    c.fillStyle = "#1d2a33"; c.beginPath(); c.roundRect(x0, 6, w, 148, 28); c.fill();
    c.fillStyle = color; c.beginPath(); c.roundRect(x0 + 6, 12, w - 12, 136, 23); c.fill();
    c.fillStyle = "#1d2a33"; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(text, W/2, 62, w - 30);
    c.font = '600 34px "Trebuchet MS",sans-serif'; c.fillText(sub, W/2, 118, w - 30);
  });
  const sp = new T.Sprite(new T.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
  sp.scale.set(3.2, 1.0, 1); sp.renderOrder = 10;
  return sp;
}
function nameTag(text, sub, color, parent, y){ const s = tagSprite(text, sub, color); s.position.y = y; parent.add(s); return s; }

function iconTex(kind){
  return canvasTex(128, 128, (c) => {
    c.lineWidth = 6; c.strokeStyle = "#1d2a33";
    if(kind === "sad"){
      c.fillStyle = "#8b96a0";
      c.beginPath(); c.arc(44, 54, 22, 0, 6.3); c.arc(70, 44, 26, 0, 6.3); c.arc(92, 58, 20, 0, 6.3); c.fill();
      c.fillRect(30, 58, 76, 20);
      c.strokeStyle = "#3d8fe0"; c.lineCap = "round";
      [[44,92],[66,100],[88,92]].forEach(([x,y]) => { c.beginPath(); c.moveTo(x, y); c.lineTo(x-5, y+16); c.stroke(); });
    } else if(kind === "anx"){
      c.fillStyle = "#5ab8f0";
      c.beginPath(); c.moveTo(64, 12); c.bezierCurveTo(64, 12, 104, 66, 104, 82); c.arc(64, 82, 40, 0, Math.PI); c.bezierCurveTo(24, 66, 64, 12, 64, 12); c.fill(); c.stroke();
      c.fillStyle = "#ffffffaa"; c.beginPath(); c.ellipse(50, 80, 8, 14, 0.3, 0, 6.3); c.fill();
    } else if(kind === "mess"){
      c.fillStyle = "#ffd23a"; c.beginPath(); c.arc(64, 64, 52, 0, 6.3); c.fill(); c.stroke();
      c.fillStyle = "#1d2a33"; c.font = "bold 84px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("?", 64, 70);
    } else {
      c.fillStyle = "#ffd23a"; c.beginPath(); c.arc(64, 64, 52, 0, 6.3); c.fill(); c.stroke();
      c.fillStyle = "#1d2a33"; c.beginPath(); c.arc(46, 52, 7, 0, 6.3); c.arc(82, 52, 7, 0, 6.3); c.fill();
      c.beginPath(); c.arc(64, 70, 26, 0.15*Math.PI, 0.85*Math.PI); c.stroke();
    }
  });
}

let actx = null, soundOn = true;
function ac(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === "suspended") actx.resume(); return actx; }
function bark(n, pitch){
  if(!soundOn) return;
  try{
    const c = ac(); pitch = pitch || 1;
    for(let i=0;i<(n||2);i++){
      const t = c.currentTime + i*0.24;
      const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
      o.type = "sawtooth"; o.frequency.setValueAtTime(560*pitch, t); o.frequency.exponentialRampToValueAtTime(190*pitch, t+0.14);
      f.type = "lowpass"; f.frequency.value = 1500;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+0.17);
      o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.2);
    }
  }catch(e){}
}
function blip(freq, dur, type){
  if(!soundOn) return;
  try{
    const c = ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq*1.8, t+dur);
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}

function openMG(html){ const m = $("mg"); m.innerHTML = `<div class="card">${html}</div>`; m.style.display = "grid"; mgOpen = true; closeDlg(); }
function closeMG(){ $("mg").style.display = "none"; mgOpen = false; if(mg && mg.raf) cancelAnimationFrame(mg.raf); if(mg && mg.cleanup) mg.cleanup(); mg = null; }
const helpNote = h => h ? `<span class="dogh">🐕 Mực đang giúp</span>` : "";

function gameBreath(p, helped, done){
  const pass = helped ? 0.55 : 0.7, CYC = 6, TOTAL = 18;
  openMG(`<h2>Thở cùng ${p.name} ${helpNote(helped)}</h2>
    <p class="sub">Giữ nút khi vòng tròn <b>phình ra</b> (hít vào), thả nút khi vòng <b>xẹp xuống</b> (thở ra). Đúng nhịp ${Math.round(pass*100)}% là qua.</p>
    <canvas id="bc" width="240" height="240"></canvas>
    <div class="big" id="bl">Chuẩn bị…</div>
    <div class="meter"><i id="bm"></i><b class="mark" style="left:${pass*100}%"></b></div>
    <button class="hold" id="bh">Giữ để hít vào · Space</button>`);
  let hold = false, t = -2, good = 0, last = performance.now();
  const bh = $("bh");
  const on = e => { if(e && e.preventDefault) e.preventDefault(); hold = true; bh.classList.add("on"); };
  const off = () => { hold = false; bh.classList.remove("on"); };
  bh.addEventListener("pointerdown", on); addEventListener("pointerup", off); addEventListener("pointercancel", off);
  mg = {keydown:k => { if(k === " ") on(); }, keyup:k => { if(k === " ") off(); },
        cleanup:() => { removeEventListener("pointerup", off); removeEventListener("pointercancel", off); }};
  const ctx = $("bc").getContext("2d");
  function loop(now){
    if(!mg) return;
    const dt = Math.min(0.1, (now - last)/1000) * (window.__speed || 1); last = now; t += dt;
    const ph = Math.max(0, t) % CYC, inh = ph < CYC/2;
    if(window.__autoBreath) hold = inh;
    if(t >= 0 && t < TOTAL){ if(hold === inh || (ph % (CYC/2)) < 0.45) good += dt; }
    const k = t < 0 ? 0 : (inh ? ph/(CYC/2) : 1 - (ph - CYC/2)/(CYC/2));
    const r = 36 + 74*(k*k*(3 - 2*k));
    ctx.clearRect(0, 0, 240, 240);
    ctx.fillStyle = "#e8f4fb"; ctx.beginPath(); ctx.arc(120, 120, 112, 0, 6.3); ctx.fill();
    ctx.fillStyle = hold ? "#5ab8f0" : "#9fd3ef"; ctx.strokeStyle = "#1d2a33"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(120, 120, r, 0, 6.3); ctx.fill(); ctx.stroke();
    $("bl").textContent = t < 0 ? `Chuẩn bị… ${Math.ceil(-t)}` : (inh ? "HÍT VÀO" : "THỞ RA") + ` · nhịp ${Math.min(3, Math.floor(t/CYC) + 1)}/3`;
    $("bm").style.width = (t > 0 ? Math.min(100, good/Math.min(t, TOTAL)*100) : 0) + "%";

/* ================= main loop ================= */
const clock = new T.Clock();
const camTarget = new T.Vector3(5.5, 2, -1.2);
let walkPhase = 0, insideBlend = 0, hudT = 0, guardT = 0;
const GSPOTS = [[-1.2, 17.4], [18, 12.5], [-20, -11], [15, -12], [-21, 12], [10, 10.5], [-14, -12]];

function collide(p){
  const r = 0.55;
  for(const b of COLL){
    const cx = Math.max(b.x0, Math.min(p.x, b.x1)), cz = Math.max(b.z0, Math.min(p.z, b.z1));
    const dx = p.x - cx, dz = p.z - cz, d2 = dx*dx + dz*dz;
    if(d2 < r*r){
      if(d2 > 1e-8){ const d = Math.sqrt(d2); p.x = cx + dx/d*r; p.z = cz + dz/d*r; }
      else {
        const opts = [[b.x0 - r - p.x, 0], [b.x1 + r - p.x, 0], [0, b.z0 - r - p.z], [0, b.z1 + r - p.z]];
        opts.sort((a, c) => Math.abs(a[0]+a[1]) - Math.abs(c[0]+c[1])); p.x += opts[0][0]; p.z += opts[0][1];
      }
    }
  }
  p.x = Math.max(-40, Math.min(40, p.x)); p.z = Math.max(-13.4, Math.min(34, p.z));
}
function turnTo(g, target, k){ let diff = target - g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); g.rotation.y += diff * Math.min(1, k); }
function lookAtPlayer(npc, base, dt, range){
  const g = npc.group, wp = new T.Vector3(); g.getWorldPosition(wp);
  const pp = player.group.position;
  const d = Math.hypot(pp.x - wp.x, pp.z - wp.z);
  turnTo(g, d < range ? Math.atan2(pp.x - wp.x, pp.z - wp.z) : base, dt*4);
}

function updPatients(dt, t, live){
  patients.forEach(p => {
    if(p.state === "off"){ if(live && dayT >= ARRIVE[p.i]) spawn(p); return; }
    if(p.state === "gone") return;
    const g = p.fig.group; let moving = false;
    if(p.path.length && !mgOpen){
      const tg = p.path[0], dx = tg.x - g.position.x, dz = tg.z - g.position.z, d = Math.hypot(dx, dz);
      if(d < 0.1){ p.path.shift(); if(!p.path.length && p.onArrive){ const cb = p.onArrive; p.onArrive = null; cb(); } }
      else { const s = Math.min(d, 3.6*dt); g.position.x += dx/d*s; g.position.z += dz/d*s; turnTo(g, Math.atan2(dx, dz), dt*10); moving = true; p.walk += dt*5.8; }
    }
    if(!p.lying){
      const sw = moving ? Math.sin(p.walk)*0.7 : 0;
      p.fig.legL.rotation.x = sw; p.fig.legR.rotation.x = -sw; p.fig.armL.rotation.x = -sw;
      p.fig.armR.rotation.x = (p.result === "happy") ? -2.6 + Math.sin(t*9)*0.3 : sw;
      if(p.state === "waiting") lookAtPlayer(p.fig, 0, dt, 7);
    }
    if(p.state === "waiting" && live){
      p.patience -= dt*100/95;
      if(p.patience < 35 && !p.warned){ p.warned = true; bark(3, 1.35); reactions.bong.t = 3; toast(`Bông sủa: ${p.name} sắp bỏ về!`, 3200); }
      if(p.patience <= 0){
        p.patience = 0; p.result = "left"; toast(`${p.name} chờ lâu quá, bỏ về rồi 😢`, 3200); blip(220, .4, "square");
        if(dlgOpen === p.name) closeDlg();
        leave(p, false);
      }
    }
    p.holder.position.set(g.position.x, p.lying ? 0.2 : g.position.y, p.lying ? g.position.z : g.position.z);
    if(p.lying) p.holder.position.x = g.position.x - 1.6;
    p.icon.position.y = 5.7 + Math.sin(t*2.2 + p.i)*0.12;
  });
}

function frame(){
  const dt = Math.min(0.05, clock.getDelta()) * (window.__speed || 1), t = clock.elapsedTime;
  const pg = player.group, pos = pg.position;
  const live = started && !mgOpen && !dayOver;
  if(live) dayT += dt;

  /* movement */
  let mx = 0, mz = 0;
  if(keys.w || keys.arrowup) mz += 1; if(keys.s || keys.arrowdown) mz -= 1;
  if(keys.a || keys.arrowleft) mx -= 1; if(keys.d || keys.arrowright) mx += 1;
  mx += joy.x; mz -= joy.y;
  const mag = Math.min(1, Math.hypot(mx, mz));
  let moving = false;
  if(!flight.on && !mgOpen && started && mag > 0.1){
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let dx = fx*mz + rx*mx, dz = fz*mz + rz*mx; const L = Math.hypot(dx, dz); dx /= L; dz /= L;
    const sp = (keys.shift ? 11 : 6.5) * mag;
    pos.x += dx*sp*dt; pos.z += dz*sp*dt;
    collide(pos);
    turnTo(pg, Math.atan2(dx, dz), dt*12);
    walkPhase += dt * sp * 1.6; moving = true;
    if(dlgOpen){ const it = getInteract().find(i => i.key === dlgOpen); if(it){ it.obj.getWorldPosition(_v); if(Math.hypot(_v.x-pos.x, _v.z-pos.z) > it.r + 2) closeDlg(); } }
  }
  {
    const sw = moving ? Math.sin(walkPhase)*0.7 : 0;
    player.legL.rotation.x += (sw - player.legL.rotation.x)*0.3; player.legR.rotation.x += (-sw - player.legR.rotation.x)*0.3;
    let aL = -sw, aR = sw;
    if(player.throwT > 0){ player.throwT -= dt; aR = -2.8 + (0.5 - player.throwT)*5; }
    if(flight.on) aR = -2.6 + Math.sin(t*8)*0.4;
    player.armL.rotation.x += (aL - player.armL.rotation.x)*0.3; player.armR.rotation.x += (aR - player.armR.rotation.x)*0.3;
    if(!flight.on) pos.y = 0;
  }

  /* inside visuals */
  const inside = !flight.on && pos.x > -10 && pos.x < 10 && pos.z > -7 && pos.z < 6.9;
  insideBlend += ((inside ? 1 : 0) - insideBlend) * Math.min(1, dt*6);
  roofGroup.visible = insideBlend < 0.5;
  Object.keys(MATS).forEach(k => { if(k.endsWith("front")) MATS[k].opacity = 1 - insideBlend*0.82; });

  /* patients */
  updPatients(dt, t, live);

  /* guard: appears / disappears */
  if(live && !flight.on){
    guardT += dt;
    const gp = guard.group.position;
    if(guardT > 30 && Math.hypot(pos.x - gp.x, pos.z - gp.z) > 10 && !patients.some(p => p.state === "arriving")){
      guardT = 0; puff(gp.clone());
      let s; do { s = GSPOTS[Math.floor(Math.random()*GSPOTS.length)]; } while(Math.abs(s[0] - gp.x) < 0.1 && Math.abs(s[1] - gp.z) < 0.1);
      gp.set(s[0], 0, s[1]); guard.home = Math.atan2(-s[0], -s[1]); guard.group.rotation.y = guard.home; puff(gp.clone());
    }
  }
  lookAtPlayer(guard, guard.home, dt, 7);
  guard.armR.rotation.x = guard.salute > 0 ? (guard.salute -= dt, -2.6) : Math.sin(t*1.3)*0.05;

  /* Mực follow */
  let mucMoving = false;
  if(mucS.follow && !flight.on){
    const g = muc.group, ry = pg.rotation.y;
    const tx = pos.x - Math.sin(ry)*1.7 + Math.cos(ry)*1.0, tz = pos.z - Math.cos(ry)*1.7 - Math.sin(ry)*1.0;
    const dx = tx - g.position.x, dz = tz - g.position.z, d = Math.hypot(dx, dz);
    if(d > 12){ g.position.x = tx; g.position.z = tz; }
    else if(d > 0.3){ const sp = Math.min(11, d*3.5); g.position.x += dx/d*sp*dt; g.position.z += dz/d*sp*dt; turnTo(g, Math.atan2(dx, dz), dt*10); mucMoving = true; }
    else lookAtPlayer(muc, g.rotation.y, dt, 6);
  }

  /* dogs idle */
  [[muc, "muc"], [bong, "bong"]].forEach(([dog, k]) => {
    const R = reactions[k];
    if(!(k === "muc" && mucS.follow)) lookAtPlayer(dog, dog.home, dt, 6);
    const ex = R.t > 0 ? (R.t -= dt, 1) : 0;
    const sleepy = k === "muc" && mucS.hungry;
    dog.tail.rotation.y = sleepy ? 0 : Math.sin(t*(ex ? 22 : 7)) * (ex ? 0.8 : 0.35);
    dog.tongue.visible = !sleepy && (ex || Math.sin(t*0.7) > 0.3);
    dog.head.rotation.x = sleepy ? 0.45 : Math.sin(t*1.6)*0.06;
    let jy = 0;
    if(R.jump > 0){ R.jump -= dt; jy = Math.sin((0.6 - R.jump)/0.6*Math.PI)*0.9; }
    dog.group.position.y = dog.baseY + jy + (sleepy ? 0 : Math.abs(Math.sin(t*(ex ? 10 : 2)))*(ex ? 0.12 : 0.03));
    if(R.spin > 0){ R.spin -= dt; dog.group.rotation.y += dt*Math.PI*2; }
    if(k === "muc" && mucMoving) dog.legs.forEach((l, i) => l.rotation.x = Math.sin(t*16 + ((i === 0 || i === 3) ? 0 : Math.PI))*0.6);
    else dog.legs.forEach((l, i) => l.rotation.x = (i === 0 && R.paw > 0) ? (R.paw -= dt, -1.4) : 0);
  });

  /* bone */
  if(bone){
    bone.t += dt;
    const k = Math.min(1, bone.t/bone.dur);
    const to = new T.Vector3(); bone.dog.head.getWorldPosition(to); to.y += 0.1;
    if(k < 1){
      bone.g.position.lerpVectors(bone.from, to, k); bone.g.position.y += Math.sin(k*Math.PI)*3;
      bone.g.rotation.z += dt*14;
      if(k > 0.55 && !bone.jumped){ bone.jumped = true; reactions[bone.key].jump = 0.6; }
    } else {
      if(!bone.caught){
        bone.caught = true; bark(2, bone.key === "bong" ? 1.35 : 1); reactions[bone.key].t = 3;
        const fed = bone.key === "muc" && mucS.fedMsg; if(fed) mucS.fedMsg = false;
        showDlg(bone.key, "Woof! Mmmf.", fed ? "No rồi! Mực sẵn sàng giúp tiếp." : "Bắt được rồi! Ngon ghê.", []);
      }
      bone.g.position.copy(to).add(new T.Vector3(Math.sin(bone.dog.group.rotation.y)*0.55, -0.15, Math.cos(bone.dog.group.rotation.y)*0.55));
      bone.g.rotation.set(0, bone.dog.group.rotation.y + Math.PI/2, 0);
      if(bone.t > bone.dur + 2.5){ scene.remove(bone.g); bone = null; }
    }
  }

  /* balloons */
  clusterBalloons.forEach(b => { const u = b.userData; b.position.x = u.base.x + Math.sin(t*0.8 + u.phase)*0.12; b.position.y = u.base.y + Math.sin(t*1.1 + u.phase)*0.15; });
  rebuildStrings();
  for(let i = flyers.length - 1; i >= 0; i--){
    const f = flyers[i]; f.a += dt; const k = Math.min(1, f.a/2.2);
    const tgt = new T.Vector3(); cluster.getWorldPosition(tgt); tgt.add(f.slot);
    f.g.position.lerpVectors(f.start, tgt, k*k*(3 - 2*k)); f.g.position.y += Math.sin(k*Math.PI)*4;
    if(k >= 1){ scene.remove(f.g); addClusterBalloon(f.c, f.slot); flyers.splice(i, 1); }
  }
  for(let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.a += dt; p.m.scale.setScalar(1 + p.a*3); p.m.material.opacity = Math.max(0, 0.9*(1 - p.a/0.7));
    if(p.a > 0.7){ scene.remove(p.m); puffs.splice(i, 1); }
  }
  clouds.forEach((c, i) => { c.position.x += dt*(0.6 + i*0.07); if(c.position.x > 100) c.position.x = -100; });

  /* flight */
  if(flight.on){
    flight.t += dt;
    const f = flight.t; let y;
    if(f < 7) y = 26 * (1 - Math.cos(Math.min(1, f/7)*Math.PI))/2;
    else if(f < 13) y = 26 + Math.sin((f-7)*1.2)*0.8;
    else if(f < 20) y = 26 * (1 + Math.cos(Math.min(1, (f-13)/7)*Math.PI))/2;
    else { y = 0; flight.on = false; pitch = 0.42; dist = 17; toast("Hạ cánh an toàn. Woof woof!"); bark(2); setTimeout(showSummary, 2200); }
    house.position.y = y; house.rotation.z = Math.sin(f*0.9)*0.03*(y/26); house.rotation.x = Math.sin(f*0.7)*0.02*(y/26);
    pos.y = y + 0.18;
    if(f < 13) yaw += dt*0.25;
  } else { house.position.y = 0; house.rotation.set(0, 0, 0); }

  /* prompt + HUD */
  const n = (!flight.on && !mgOpen && started) ? nearest() : null;
  const pr = $("prompt");
  if(n && !(dlgOpen && dlgOpen === n.key)){ pr.style.display = "block"; pr.innerHTML = `<kbd>E</kbd>${n.label}`; }
  else pr.style.display = "none";
  hudT += dt; if(hudT > 0.25){ hudT = 0; renderTasks(); }

  /* camera */
  const wantPitch = Math.max(pitch, 0.42 + insideBlend*0.55);
  const wantDist = dist * (1 - insideBlend*0.1);
  camYaw += (yaw - camYaw) * Math.min(1, dt*8);
  camPitch += (wantPitch - camPitch) * Math.min(1, dt*5);
  camDist += (wantDist - camDist) * Math.min(1, dt*5);
  camTarget.lerp(new T.Vector3(pos.x, pos.y + (flight.on ? 8 : 2), pos.z), Math.min(1, dt*8));
  camera.position.set(
    camTarget.x + Math.sin(camYaw)*Math.cos(camPitch)*camDist,
    camTarget.y + Math.sin(camPitch)*camDist,
    camTarget.z + Math.cos(camYaw)*Math.cos(camPitch)*camDist);
  camera.lookAt(camTarget);
  sun.position.set(camTarget.x + 28, 48, camTarget.z + 30); sun.target.position.copy(camTarget); sun.target.updateMatrixWorld();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
renderTasks();
$("loading").remove();
showIntro();
requestAnimationFrame(frame);

addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__game = {player, patients, mucS, muc, guard, doInteract, startFlight, flight,
  get dlg(){ return dlgOpen; }, get mgOpen(){ return mgOpen; }, get dayOver(){ return dayOver; }, get dayT(){ return dayT; }, get started(){ return started; },
  setDay(v){ dayT = v; }, choose(i){ if(dlgChoices[i]) dlgChoices[i].f(); }};
})();
</script>
</body>
